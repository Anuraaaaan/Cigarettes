# Cigarette and vape configuration.

# Full documentation:
# English: https://github.com/Anuraaaaan/Cigarettes/wiki/Cigarettes%E2%80%90EN
# Русский: https://github.com/Anuraaaaan/Cigarettes/wiki/Cigarettes%E2%80%90RU

cigarettes:
  # Item identifier.
  winston:
    # Enables or disables the item.
    enabled: true

    # Enables or disables the item.
    name: "Winston"

    # Item name.
    lore:
      - "&#AAAAAAClassic Winston cigarette"

    # Base item material.
    material: stick

    # Maximum stack size.
    max_stack_size: 64

    # Item usage duration in seconds.
    consume_seconds: 0.4

    # Animation played when using the item.
    # Available values: NONE, EAT, DRINK, BLOCK, BOW, SPEAR, CROSSBOW, SPYGLASS, TOOT_HORN, BRUSH, BUNDLE.
    animation: EAT

    # Item cooldown duration in seconds.
    cooldown_seconds: 1.0

    # Amount of nicotine gained per puff.
    nicotine: 3.3

    # Amount of addiction gained per puff.
    addiction: 0.5

    # Item model settings.
    models:
      # Item model for an unlit cigarette or inactive vape.
      default_item_model: "minecraft:stick"

      # Custom model data for an unlit cigarette or inactive vape.
      default_custom_model_data: "winston"

      # Item model for a lit cigarette or activated vape.
      # The key represents the percentage of the remaining resource.
      remaining_item_models:
        100: "minecraft:soul_torch"
        65: "minecraft:torch"
        25: "minecraft:redstone_torch"

      # Custom model data for a lit cigarette or activated vape.
      # The key represents the percentage of the remaining resource.
      remaining_custom_model_data:
        100: "one"
        75: "two"
        50: "three"
        25: "four"

    # Cigarette burning settings.
    burn:
      # Cigarette burn duration in seconds.
      burn_duration: 60

      # Number of seconds deducted from the remaining burn time with each puff.
      burn_time_reduction_per_puff: 10

      # Whether an item is required to ignite the cigarette.
      require_ignition: true

    # Item given after the cigarette has been completely smoked.
    return_item: "winston_butt"

    # Particles created while smoking.
    particles:
      - "CAMPFIRE_COSY_SMOKE, 0.5, -0.25, 10, 0, 0, 0, 0.1"
      - "smoke, 0.5, -0.25, 4, 0, 0, 0, 0"

    # Effects applied to the player while smoking.
    effects:
      - "regeneration, 60, 0"
      - "fire_resistance, 30, 1"

    # Sounds played during different actions.
    # The key determines the action that triggers the sound.
    sounds:
      # Sound played when the cigarette is ignited.
      ignite: "minecraft:item.flintandsteel.use, 2, 1.1"

      # Sound played when the cigarette is extinguished.
      extinguish: "minecraft:block.fire.extinguish, 2, 1.3"

      # Sound played with each puff.
      puff: "minecraft:block.blastfurnace.fire_crackle, 2, 1.5"

  vape:
    enabled: true

    name: "&#6c6c6cVape"

    material: stick

    max_stack_size: 64

    consume_seconds: 1

    animation: EAT

    cooldown_seconds: 0.2

    nicotine: 1.5

    addiction: 0.8

    models:
      default_item_model: "minecraft:black_candle"

      remaining_item_models:
        100: "minecraft:black_candle"
        75: "minecraft:gray_candle"
        50: "minecraft:light_gray_candle"
        25: "minecraft:white_candle"

    # Vape settings.
    puffs:

      # Maximum number of puffs.
      max_puffs: 50

      # Whether to keep the item after all puffs have been used.
      keep_after_depletion: true

      # Sound played when refilling the vape.
      refill_sound: "minecraft:block.brewing_stand.brew, 2, 1.1"

      # Items used to refill the vape.
      refill_items:

        # Item name.
        apple:
          # Number of puffs restored.
          restored_puffs: 1

        apple_vape_refill:
          restored_puffs: 3

          # Item returned after refilling.
          return_item: glass_bottle

    return_item: "winston_butt"

    particles:
      - "DUST, 1, -0.25, 10, 0.1, 0.1, 0.1, 0.1, 255, 28, 43, 2"

    effects:
      - "regeneration, 60, 1"

    sounds:
      ignite: "minecraft:block.copper_bulb.turn_on, 2, 1"
      extinguish: "minecraft:block.fire.extinguish, 2, 1.3"
      puff: "minecraft:entity.breeze.inhale, 2, 0.7"