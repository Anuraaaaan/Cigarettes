cigarettes:
  winston:
    name: "Winston" # название
    lore: []    # описание
    base_item: stick # предмет использующийся за основу
    item_model_start: "minecraft:stick" # не горящая сигарета. получается при крафте
    item_models: # модели горящей сигареты
      100: "minecraft:soul_torch" # когда только начала гореть
      75: "minecraft:copper_torch" # промежуточная стадия
      50: "minecraft:torch" # промежуточная стадия
      25: "minecraft:redstone_torch" # на последней стадии горения
    max_stack: 64 # максимальный стак стартовой сигареты

    requires_ignition: true # нужна ли зажигалка
    burn_duration: 100 # какое время горения. если 0, то не имеет время горения
    burn_time_per_puff: 10 # на сколько уменьшается при использовании. если 0, то не уменьшается



    number_puffs: 500 # сколько всего затяжек. если 0, то не имеет затяжек

    return_item: paper # возвращаемый предмет

    items_repair:
      - apple # предмет для починки. если null, то не имеет предмета для починки
      - stick



    particles: # партиклы SMOKE, LARGE_SMOKE, WHITE_SMOKE, CAMPFIRE_SIGNAL_SMOKE, CAMPFIRE_COSY_SMOKE, ASH, CLOUD,
               # FLAME, SMALL_FLAME.| DUST - название, смещение вперёд от лица, +y, количество, offsetX, offsetY, offsetZ, скорость, r, g, b, size
      - CAMPFIRE_COSY_SMOKE, 0.5, -0.25, 10, 0, 0, 0, 0.1 # название, смещение вперёд от лица, +y, количество, offsetX, offsetY, offsetZ, скорость
      - smoke, 0.5, -0.25, 4, 0, 0, 0, 0
    effects: # эффекты
      - regeneration, 60, 0 # название эффекта, продолжительность, уровень
      - fire_resistance, 30, 1

    sounds: # звуки
      light: "minecraft:item.flintandsteel.use, 2, 1.1" # при зажении
      burning: "minecraft:block.blastfurnace.fire_crackle, 2, 1.5" # во время горения
      extinguishing: "minecraft:block.fire.extinguish, 2, 1.3" # окончание горения
