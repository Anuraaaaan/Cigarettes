# Custom item configuration

# Full documentation:
# English: https://github.com/Anuraaaaan/Cigarettes/wiki/Custom%E2%80%90Items%E2%80%90EN
# Русский: https://github.com/Anuraaaaan/Cigarettes/wiki/Custom%E2%80%90Items%E2%80%90RU

custom_items:
  # Custom item identifier.
  nic_off_gum:
    # Enables or disables the custom item.
    enabled: true

    # Item name.
    name: "&#72ff6aAddiction Relief Gum"

    # Base item material.
    material: stick

    # Maximum stack size.
    max_stack_size: 64

    # Item Model used to display the item.
    item_model: "minecraft:slime_block"

    # Change to the nicotine level when using the item.
    nicotine: -2.3

    # Change to the tolerance level when using the item.
    tolerance: -0.5

    # Change to the addiction level when using the item.
    addiction: -0.2

    # Allows the item to be used by right-clicking.
    use_on_right_click: false

    # Settings for using the item as a consumable.
    consumable:
      # Item usage duration in seconds.
      consume_seconds: 1.2

      # Animation played when using the item.
      animation: EAT

      # Sound played when using the item.
      sound: "minecraft:entity.generic.eat"

      # Whether to play particles when using the item.
      particles: true

  apple_vape_refill:
    enabled: true
    name: "&#AAAAAAApple vape refill"

    # Item description.
    lore:
      - "&#AAAAAAFreshness in every drop of vapor."

    material: stick
    max_stack_size: 64

    item_model: "minecraft:apple"

    # Custom Model Data used to display the item.
    custom_model_data: "apple_vape_refill"

  winston_butt:
    enabled: true
    name: "&#AAAAAAWinston Cigarette Butt"
    lore:
      - "&#AAAAAAOnce gave a few minutes of peace."
      - "&#C49494Now, it is only a reminder of them."

    material: snowball
    max_stack_size: 64
    item_model: "minecraft:stick"