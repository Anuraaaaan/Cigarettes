# Main configuration for the Cigarettes plugin.

# Full documentation:
# English: https://github.com/Anuraaaaan/Cigarettes/wiki/Config%E2%80%90EN
# Русский: https://github.com/Anuraaaaan/Cigarettes/wiki/Config%E2%80%90RU

# Configuration version.
# Used by the plugin to determine the config structure version.
version: 1

# Language file used by the plugin.
# For example: ru, en.
lang: en

# Items that can be used to ignite cigarettes.
igniters:
  - flint_and_steel
  - fire_charge
  - winston_butt

# Amount of tolerance gained per unit of nicotine.
# For example, with a value of 0.5, 3 units of nicotine will give 1.5 tolerance.
tolerance: 0.5

# Interval for saving player data to the database, in minutes.
database_update_minutes: 10

# Gradual reduction of nicotine, tolerance, and addiction levels.
nicotine_decay:
  # Amount of nicotine reduced per interval.
  nicotine_amount: 1

  # Nicotine decay interval in seconds.
  nicotine_interval: 120

  # Amount of tolerance reduced per interval.
  tolerance_amount: 1

  # Tolerance decay interval in seconds.
  tolerance_interval: 1800

  # Amount of addiction reduced per interval.
  addiction_amount: 1

  # Addiction decay interval in seconds.
  addiction_interval: 7200

# Nicotine withdrawal level settings.
# Each level has its own activation conditions, symptom interval, displayed thoughts, and effects.
nicotine_withdrawal:
  # Withdrawal level.
  1:
    # Conditions required to activate this level.
    conditions:
      min_addiction: 15
      max_nicotine: 15

    # Interval between symptom occurrences in seconds.
    # A random value between min_seconds and max_seconds is selected.
    withdrawal_delay:
      min_seconds: 180
      max_seconds: 300

    # Random thought displayed to the player when a symptom occurs.
    thoughts:
      - "&#AAAAAAI could use a cigarette..."
      - "&#AAAAAAI feel like having a smoke."
      - "&#AAAAAAIt's been a while since I last smoked..."
      - "&#AAAAAAMaybe it's time to have a smoke."

    # Effects applied to the player when a symptom occurs.
    # Format: EFFECT, duration, amplifier.
    effects:
      - "mining_fatigue, 9, 0"

  2:
    conditions:
      min_addiction: 35
      min_tolerance: 15
      max_nicotine: 10

    withdrawal_delay:
      min_seconds: 120
      max_seconds: 240

    thoughts:
      - "&#FFD580I really feel like smoking."
      - "&#FFD580I should have a cigarette."
      - "&#FFD580I can't get cigarettes out of my head."
      - "&#FFD580I really need a puff."

    effects:
      - "hunger, 10, 0"
      - "mining_fatigue, 14, 1"

  3:
    conditions:
      min_addiction: 60
      min_tolerance: 30
      max_nicotine: 5

    withdrawal_delay:
      min_seconds: 90
      max_seconds: 180

    thoughts:
      - "&#FFAA55I can't stop thinking about cigarettes."
      - "&#FFAA55I need a cigarette right now."
      - "&#FFAA55It's getting harder and harder to go without a cigarette."
      - "&#FFAA55I want to smoke. Right now."

    effects:
      - "hunger, 15, 1"
      - "mining_fatigue, 16, 1"
      - "weakness, 10, 1"

  4:
    conditions:
      min_addiction: 80
      min_tolerance: 40
      max_nicotine: 2

    withdrawal_delay:
      min_seconds: 60
      max_seconds: 120

    thoughts:
      - "&#FF5555I need a cigarette right now..."
      - "&#FF5555I can't take this anymore."
      - "&#FF5555I feel terrible without a cigarette."
      - "&#FF5555A cigarette. Right now."
      - "&#FF5555I can't think about anything else."

    effects:
      - "hunger, 20, 2"
      - "mining_fatigue, 20, 2"
      - "weakness, 14, 2"
      - "nausea, 10, 2"
